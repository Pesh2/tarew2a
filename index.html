<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarew2a</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6efe6;--card:#fffaf3;--ink:#3b2a20;--muted:#8a7565;--accent:#a8643a;--line:#e6d8c6}
:root[data-theme="dark"]{--bg:#1d1612;--card:#271e18;--ink:#f1e4d3;--muted:#a8927f;--accent:#e0a070;--line:#3a2d24}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 64px}
header{padding:40px 0 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
h1{font-family:Fraunces,serif;font-size:2.4rem;margin:0}
h1 span{color:var(--accent)}
.tag{color:var(--muted);margin:4px 0 0}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px}
button:hover{border-color:var(--accent)}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 20px}
input[type=search]{flex:1;min-width:180px;font:inherit;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.meta{font-size:.78rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.card h2{font-family:Fraunces,serif;font-size:1.1rem;margin:0}
.card a{color:inherit;text-decoration:none}
.card a:hover{color:var(--accent)}
.card p{margin:0;font-size:.9rem;color:var(--muted);flex:1}
.save{align-self:flex-start;padding:3px 12px;font-size:.8rem}
.note{background:var(--card);border:1px dashed var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:.9rem}
.empty{color:var(--muted);text-align:center;padding:40px 0}
footer{margin-top:40px;color:var(--muted);font-size:.8rem;text-align:center}
.coffee{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:var(--bg);z-index:9;flex-direction:column;gap:12px;text-align:center}
.coffee.show{display:flex}
.coffee .time{font-family:Fraunces,serif;font-size:4rem}
</style>
</head>
<body>
<div class="wrap">
 <header>
  <div>
   <h1>Tarew<span>2</span>a ☕</h1>
   <p class="tag">Fresh reads for your coffee break. One calm place, many good sources.</p>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">
   <button id="coffeeBtn">☕ Coffee timer</button>
   <button id="themeBtn">🌙 Dark</button>
  </div>
 </header>
 <div id="note"></div>
 <div class="bar">
  <input type="search" id="q" placeholder="Search articles…">
  <button id="savedBtn">★ Saved</button>
 </div>
 <div class="bar" id="topics"></div>
 <div class="bar" id="sources"></div>
 <div class="grid" id="grid"></div>
 <footer>Tarew2a shows headlines and short excerpts only. All articles belong to their original sites.</footer>
</div>

<div class="coffee" id="coffee">
 <div>Take a sip. Read one thing slowly.</div>
 <div class="time" id="clock">15:00</div>
 <button id="coffeeStop">End break</button>
</div>

<script>
const $ = s => document.querySelector(s);
const state = {all: [], topic: "All", source: "All", q: "", savedOnly: false};
const store = {
  get(k, d){ try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
let saved = new Set(store.get("tarew2a-saved", []));

function esc(s){ const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }
function readTime(t){ const w = (t || "").split(/\s+/).length; return Math.max(1, Math.round(w / 40)) ; }
function ago(iso){
  if(!iso) return "";
  const days = Math.floor((Date.now() - new Date(iso)) / 864e5);
  if(days <= 0) return "today";
  if(days === 1) return "yesterday";
  if(days < 30) return days + " days ago";
  return new Date(iso).toLocaleDateString();
}

function chips(el, items, key){
  el.innerHTML = items.map(i => `<button class="${state[key]===i?'on':''}" data-v="${esc(i)}">${esc(i)}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if(!b) return; state[key] = b.dataset.v; render(); };
}

function render(){
  const topics = ["All", ...new Set(state.all.map(a => a.topic))];
  const sources = ["All", ...new Set(state.all.map(a => a.source))];
  chips($("#topics"), topics, "topic");
  chips($("#sources"), sources, "source");
  $("#savedBtn").classList.toggle("on", state.savedOnly);
  const q = state.q.toLowerCase();
  const list = state.all.filter(a =>
    (state.topic === "All" || a.topic === state.topic) &&
    (state.source === "All" || a.source === state.source) &&
    (!state.savedOnly || saved.has(a.link)) &&
    (!q || (a.title + " " + a.excerpt + " " + a.source).toLowerCase().includes(q)));
  $("#grid").innerHTML = list.length ? list.map(a => `
    <article class="card">
      <div class="meta"><span>${esc(a.source)}</span><span>${esc(ago(a.date))}</span></div>
      <h2><a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h2>
      <p>${esc(a.excerpt)}</p>
      <div class="meta"><span>~${readTime(a.excerpt) + 3} min</span><span>${esc(a.topic)}</span></div>
      <button class="save" data-link="${esc(a.link)}">${saved.has(a.link) ? "★ Saved" : "☆ Save"}</button>
    </article>`).join("") : `<div class="empty">Nothing here yet. Try another filter.</div>`;
}

$("#grid").addEventListener("click", e => {
  const b = e.target.closest(".save"); if(!b) return;
  const l = b.dataset.link;
  saved.has(l) ? saved.delete(l) : saved.add(l);
  store.set("tarew2a-saved", [...saved]);
  render();
});
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#savedBtn").onclick = () => { state.savedOnly = !state.savedOnly; render(); };

function setTheme(t){
  document.documentElement.dataset.theme = t;
  $("#themeBtn").textContent = t === "dark" ? "☀️ Light" : "🌙 Dark";
  store.set("tarew2a-theme", t);
}
$("#themeBtn").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
setTheme(store.get("tarew2a-theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

let timer;
$("#coffeeBtn").onclick = () => {
  let left = 15 * 60;
  $("#coffee").classList.add("show");
  const tick = () => {
    $("#clock").textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
    if(left-- <= 0){ clearInterval(timer); $("#coffee").classList.remove("show"); }
  };
  clearInterval(timer); tick(); timer = setInterval(tick, 1000);
};
$("#coffeeStop").onclick = () => { clearInterval(timer); $("#coffee").classList.remove("show"); };

fetch("articles.json").then(r => r.json()).then(d => {
  state.all = d.articles || [];
  if(d.demo) $("#note").innerHTML = `<div class="note">Demo mode: these are placeholder cards. Turn on the automatic update (see README) and real headlines will appear here.</div>`;
  else if(d.updated) $("#note").innerHTML = `<div class="note">Last updated ${esc(new Date(d.updated).toLocaleString())}</div>`;
  render();
}).catch(() => {
  $("#grid").innerHTML = `<div class="empty">Could not load articles.json. If you opened this file directly, run a local server (python3 -m http.server).</div>`;
});
</script>
</body>
</html>
