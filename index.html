<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tarew2a</title>
<meta name="description" content="Fresh reads on science, data, tech, business and economics, gathered in one calm place.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Reem+Kufi:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8F0EE; --paper:#F7FBFA; --ink:#1F1611; --muted:#55645F; --line:#C5D4CF;
  --accent:#17705D; --accent-ink:#FFFFFF; --crema:#C99A5B; --coffee:#4A2E20; --cup:#FFFFFF;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --read:"Newsreader",Georgia,serif;
  --ui:"Bricolage Grotesque",system-ui,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#1A1310; --paper:#241A15; --ink:#F1E7DA; --muted:#A99A8B; --line:#3A2C24;
  --accent:#7FD1B9; --accent-ink:#10231D; --crema:#D9AE7A; --coffee:#2A1A12; --cup:#F1E7DA;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* top bar */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none;margin-right:auto}
.brand .ar{font-family:"Reem Kufi",var(--display);font-size:1.75rem;line-height:1;color:var(--accent)}
.brand .en{font-weight:700;letter-spacing:-.01em}
.search{position:relative;flex:0 1 260px}
.search input{width:100%;font:inherit;padding:9px 14px 9px 38px;border-radius:12px;border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.search svg{position:absolute;left:12px;top:50%;translate:0 -50%;width:16px;height:16px;stroke:var(--muted)}
.tbtn{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px 13px;font-weight:500;display:inline-flex;align-items:center;gap:7px}
.tbtn:hover{border-color:var(--accent)}
.tbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:32px;align-items:center;padding:48px 0 36px}
.hello{font-family:var(--display);font-weight:800;font-size:clamp(2.4rem,6vw,4.4rem);line-height:1;letter-spacing:-.035em;margin:0 0 10px}
.sub{color:var(--muted);margin:0 0 28px;font-size:1.05rem}
.lead{display:block;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px 26px;transition:border-color .2s}
.lead:hover{border-color:var(--accent)}
.lead .from{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;margin-bottom:10px}
.lead h2{font-family:var(--display);font-weight:700;font-size:clamp(1.4rem,2.6vw,2rem);line-height:1.15;letter-spacing:-.02em;margin:0 0 10px}
.lead p{font-family:var(--read);font-size:1.1rem;line-height:1.55;color:var(--muted);margin:0;max-width:60ch}
.cupbox{justify-self:center;width:min(100%,340px)}
.cupbox svg{width:100%;height:auto;display:block}

/* cup drawing */
.c-saucer{fill:var(--line)}
.c-body{fill:var(--cup)}
.c-handle{fill:none;stroke:var(--cup);stroke-width:11;stroke-linecap:round}
.c-rim{fill:none;stroke:var(--cup);stroke-width:5}
.c-coffee{fill:var(--coffee)}
.c-crema{fill:var(--crema)}
.c-steam{fill:none;stroke:var(--muted);stroke-width:4;stroke-linecap:round;opacity:.0}
.liq{transition:transform 1s linear}
@media (prefers-reduced-motion:no-preference){
  .c-steam{animation:steam 4.5s ease-in-out infinite}
  .c-steam:nth-of-type(2){animation-delay:1.4s}
  .c-steam:nth-of-type(3){animation-delay:2.8s}
  @keyframes steam{0%{opacity:0;transform:translateY(12px)}35%{opacity:.55}100%{opacity:0;transform:translateY(-14px)}}
  .hero>*{animation:rise .7s ease both}
  .hero>*:nth-child(2){animation-delay:.12s}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
}

/* filters */
.filters{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0}
.row{display:flex;flex-wrap:wrap;gap:4px 22px;align-items:center;padding:6px 0}
.tab{background:none;border:0;padding:8px 0;font-weight:500;color:var(--muted);border-bottom:2px solid transparent}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
.tab small{color:var(--muted);font-weight:400;margin-left:4px}
.src{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 9px;display:inline-flex;align-items:center;gap:7px;font-size:.9rem;color:var(--muted)}
.src:hover{border-color:var(--accent);color:var(--ink)}
.src[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--accent));flex:none}
.spacer{margin-left:auto}

/* feed */
h3.sec{font-family:var(--display);font-size:1.25rem;letter-spacing:-.01em;margin:36px 0 14px}
.picks{display:grid;grid-template-columns:repeat(3,1fr)}
.pick{padding:4px 24px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.pick:first-child{border-left:0;padding-left:0}
.pick h4{font-family:var(--display);font-weight:700;font-size:1.3rem;line-height:1.2;letter-spacing:-.015em;margin:0}
.pick h4 a{text-decoration:none}
.pick h4 a:hover,.item h4 a:hover,.lead:hover h2{color:var(--accent)}
.pick p{font-family:var(--read);color:var(--muted);margin:0;font-size:1.02rem;line-height:1.55}
.meta{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.88rem}
.star{margin-left:auto;background:none;border:0;padding:6px;border-radius:8px;color:var(--muted);line-height:0}
.star:hover{color:var(--ink)}
.star[aria-pressed="true"]{color:var(--crema)}
.star svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.star[aria-pressed="true"] svg{fill:currentColor}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:start;padding:18px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .dot{margin-top:9px}
.item h4{font-family:var(--display);font-weight:700;font-size:1.12rem;line-height:1.25;margin:0 0 3px;letter-spacing:-.01em}
.item h4 a{text-decoration:none}
.item p{font-family:var(--read);color:var(--muted);margin:0 0 4px;font-size:1rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:78ch}
.empty{padding:56px 0;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:1.3rem;margin-bottom:6px}
.note{margin:0 0 20px;padding:12px 16px;border:1px dashed var(--accent);border-radius:14px;color:var(--muted);font-size:.95rem}
footer{margin:56px 0 40px;color:var(--muted);font-size:.88rem;max-width:70ch}

/* coffee break */
.break{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.break.show{display:flex}
.break .cupbox{width:min(70vw,300px)}
.clock{font-family:var(--display);font-weight:800;font-size:clamp(3rem,10vw,5rem);letter-spacing:-.04em;line-height:1}
.break p{margin:0;color:var(--muted);max-width:36ch}
.durs{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.durs button,.closeb{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:10px 18px;font-weight:500}
.durs button:hover,.closeb:hover{border-color:var(--accent)}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;padding-top:28px}
  .cupbox{order:-1;width:150px}
  .picks{grid-template-columns:1fr}
  .pick{border-left:0;padding:16px 0;border-top:1px solid var(--line)}
  .pick:first-child{border-top:0;padding-top:4px}
  .top .wrap{flex-wrap:wrap;height:auto;padding-top:10px;padding-bottom:10px}
  .search{order:5;flex:1 1 100%}
  .brand .en{display:none}
  .tbtn .lbl{display:none}
}
</style>
</head>
<body>

<header class="top">
 <div class="wrap">
  <a class="brand" href="./" aria-label="Tarew2a home"><span class="ar" lang="ar">طراوة</span><span class="en">tarew2a</span></a>
  <label class="search">
   <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
   <input id="q" type="search" placeholder="Search articles  (press /)" aria-label="Search articles">
  </label>
  <button class="tbtn" id="savedBtn" aria-pressed="false">★ <span class="lbl">Saved</span> <span id="savedCount"></span></button>
  <button class="tbtn" id="breakBtn">☕ <span class="lbl">Coffee break</span></button>
  <button class="tbtn" id="themeBtn" aria-label="Switch theme">🌙</button>
 </div>
</header>

<main class="wrap">
 <section class="hero" id="hero">
  <div>
   <h1 class="hello" id="hello">Good evening.</h1>
   <p class="sub" id="sub">Your coffee is ready.</p>
   <div id="leadSlot"></div>
  </div>
  <div class="cupbox" id="heroCup"></div>
 </section>

 <div id="note"></div>

 <section class="filters" aria-label="Filters">
  <div class="row" id="topics"></div>
  <div class="row" id="sources"></div>
 </section>

 <div id="feed"></div>

 <footer>Tarew2a shows headlines and short excerpts. Every article belongs to its original site, and each card links to it.</footer>
</main>

<section class="break" id="break" role="dialog" aria-modal="true" aria-label="Coffee break">
 <div class="cupbox" id="breakCup"></div>
 <div class="clock" id="clock">15:00</div>
 <p id="breakMsg">Pick a length, put your phone down, and read one thing slowly.</p>
 <div class="durs" id="durs">
  <button data-min="5">5 min</button><button data-min="15">15 min</button><button data-min="25">25 min</button>
 </div>
 <button class="closeb" id="closeBreak">Back to reading</button>
</section>

<script>
const $ = s => document.querySelector(s);
const COLORS = ["#17705D","#B5651D","#3B6EA5","#8E4A8F","#C0392B","#6B8E23","#B08900","#2F7F9E"];
const state = {all:[], topic:"All", source:"All", q:"", savedOnly:false, colors:{}};
const store = {
  get(k,d){ try{ const v = JSON.parse(localStorage.getItem(k)); return v ?? d }catch{ return d } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)) }catch{} }
};
let saved = new Set(store.get("tarew2a-saved", []));

const esc = s => { const d=document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; };
const ago = iso => {
  if(!iso) return "";
  const d = Math.floor((Date.now()-new Date(iso))/864e5);
  if(d<=0) return "today"; if(d===1) return "yesterday"; if(d<30) return d+" days ago";
  return new Date(iso).toLocaleDateString();
};

/* ---------- cup drawing ---------- */
function cup(id, fill){
  const y = (1-fill)*120;
  return `<svg viewBox="0 0 200 220" role="img" aria-label="A cup of coffee">
   <defs><clipPath id="${id}"><path d="M40 70H160V120C160 158 134 182 100 182C66 182 40 158 40 120Z"/></clipPath></defs>
   <path class="c-steam" d="M82 58C70 44 94 34 82 18"/>
   <path class="c-steam" d="M104 60C92 44 116 32 104 14"/>
   <path class="c-steam" d="M126 58C114 46 136 36 126 22"/>
   <ellipse class="c-saucer" cx="100" cy="190" rx="82" ry="13"/>
   <path class="c-handle" d="M158 88C192 86 190 138 152 140"/>
   <path class="c-body" d="M40 70H160V120C160 158 134 182 100 182C66 182 40 158 40 120Z"/>
   <g clip-path="url(#${id})"><g class="liq" id="${id}-liq" style="transform:translateY(${y}px)">
     <rect class="c-coffee" x="30" y="70" width="140" height="160"/>
     <ellipse class="c-crema" cx="100" cy="70" rx="56" ry="7"/>
   </g></g>
   <ellipse class="c-rim" cx="100" cy="70" rx="60" ry="8"/>
  </svg>`;
}
$("#heroCup").innerHTML = cup("hc", .95);
$("#breakCup").innerHTML = cup("bc", 1);

/* ---------- greeting ---------- */
(function(){
  const h = new Date().getHours();
  const g = h<5 ? "Still up?" : h<12 ? "Good morning." : h<17 ? "Good afternoon." : h<21 ? "Good evening." : "Late-night read?";
  $("#hello").textContent = g;
})();

/* ---------- rendering ---------- */
const dotFor = s => `<span class="dot" style="--c:${state.colors[s]||COLORS[0]}"></span>`;
const starBtn = l => `<button class="star" data-link="${esc(l)}" aria-pressed="${saved.has(l)}" aria-label="${saved.has(l)?"Remove from saved":"Save for later"}"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg></button>`;

function filtered(){
  const q = state.q.trim().toLowerCase();
  return state.all.filter(a =>
    (state.topic==="All" || a.topic===state.topic) &&
    (state.source==="All" || a.source===state.source) &&
    (!state.savedOnly || saved.has(a.link)) &&
    (!q || (a.title+" "+a.excerpt+" "+a.source).toLowerCase().includes(q)));
}

function renderFilters(){
  const topics = ["All", ...new Set(state.all.map(a=>a.topic))];
  $("#topics").innerHTML = topics.map(t => {
    const n = t==="All" ? state.all.length : state.all.filter(a=>a.topic===t).length;
    return `<button class="tab" data-topic="${esc(t)}" aria-pressed="${state.topic===t}">${esc(t)}<small>${n}</small></button>`;
  }).join("") + `<span class="spacer"></span><button class="src" id="surprise">🎲 Surprise me</button>`;
  const sources = ["All", ...new Set(state.all.map(a=>a.source))];
  $("#sources").innerHTML = sources.map(s =>
    `<button class="src" data-source="${esc(s)}" aria-pressed="${state.source===s}">${s==="All"?"":dotFor(s)}${esc(s)}</button>`
  ).join("");
}

function renderFeed(){
  const list = filtered();
  const plain = state.topic==="All" && state.source==="All" && !state.q.trim() && !state.savedOnly;
  const lead = state.all[0];
  const slot = $("#leadSlot");
  if(lead){
    slot.innerHTML = `<a class="lead" href="${esc(lead.link)}" target="_blank" rel="noopener noreferrer">
      <div class="from">${dotFor(lead.source)}<span>${esc(lead.source)}</span><span>${esc(ago(lead.date))}</span></div>
      <h2>${esc(lead.title)}</h2><p>${esc(lead.excerpt)}</p></a>`;
  } else slot.innerHTML = "";

  $("#savedCount").textContent = saved.size ? `(${saved.size})` : "";
  $("#savedBtn").setAttribute("aria-pressed", state.savedOnly);

  if(!list.length){
    $("#feed").innerHTML = state.savedOnly && !saved.size
      ? `<div class="empty"><strong>Nothing saved yet</strong>Tap the star on any article to keep it here.</div>`
      : `<div class="empty"><strong>No articles match</strong>Clear the search or choose All to see everything.</div>`;
    return;
  }
  const rest = plain ? list.filter(a => a !== lead) : list;
  const picks = plain ? rest.slice(0,3) : [];
  const more = plain ? rest.slice(3) : rest;
  let html = "";
  if(picks.length){
    html += `<h3 class="sec">Worth your coffee</h3><div class="picks">` + picks.map(a => `
      <article class="pick">
        <div class="meta">${dotFor(a.source)}<span>${esc(a.source)}</span><span>${esc(ago(a.date))}</span>${starBtn(a.link)}</div>
        <h4><a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h4>
        <p>${esc(a.excerpt)}</p>
      </article>`).join("") + `</div>`;
  }
  if(more.length){
    html += `<h3 class="sec">${plain ? "More to read" : list.length+" "+(list.length===1?"article":"articles")}</h3><div class="list">` + more.map(a => `
      <article class="item">
        ${dotFor(a.source)}
        <div>
          <h4><a href="${esc(a.link)}" target="_blank" rel="noopener noreferrer">${esc(a.title)}</a></h4>
          <p>${esc(a.excerpt)}</p>
          <div class="meta"><span>${esc(a.source)}</span><span>${esc(ago(a.date))}</span></div>
        </div>
        ${starBtn(a.link)}
      </article>`).join("") + `</div>`;
  }
  $("#feed").innerHTML = html;
}

function render(){ renderFilters(); renderFeed(); }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-topic]"); if(t){ state.topic = t.dataset.topic; state.savedOnly=false; return render(); }
  const s = e.target.closest("[data-source]"); if(s){ state.source = s.dataset.source; state.savedOnly=false; return render(); }
  const st = e.target.closest(".star"); if(st){
    const l = st.dataset.link; saved.has(l) ? saved.delete(l) : saved.add(l);
    store.set("tarew2a-saved",[...saved]); return renderFeed();
  }
  if(e.target.closest("#surprise")){
    const pool = filtered(); if(!pool.length) return;
    window.open(pool[Math.floor(Math.random()*pool.length)].link, "_blank", "noopener");
  }
});
$("#q").addEventListener("input", e => { state.q = e.target.value; renderFeed(); });
$("#savedBtn").onclick = () => { state.savedOnly = !state.savedOnly; renderFeed(); };
document.addEventListener("keydown", e => {
  if(e.key==="/" && document.activeElement.tagName!=="INPUT"){ e.preventDefault(); $("#q").focus(); }
  if(e.key==="Escape") closeBreak();
});

/* theme */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $("#themeBtn").textContent = t==="dark" ? "☀️" : "🌙";
  store.set("tarew2a-theme", t);
}
$("#themeBtn").onclick = () => setTheme(document.documentElement.dataset.theme==="dark" ? "light" : "dark");
setTheme(store.get("tarew2a-theme", matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

/* coffee break timer */
let tick = null;
const liq = () => $("#bc-liq");
function resetBreak(){
  clearInterval(tick);
  liq().style.transform = "translateY(0px)";
  $("#clock").textContent = "15:00";
  $("#breakMsg").textContent = "Pick a length, put your phone down, and read one thing slowly.";
  $("#durs").style.display = "flex";
}
function closeBreak(){ clearInterval(tick); $("#break").classList.remove("show"); }
$("#breakBtn").onclick = () => { resetBreak(); $("#break").classList.add("show"); $("#durs button").focus(); };
$("#closeBreak").onclick = closeBreak;
$("#durs").onclick = e => {
  const b = e.target.closest("button"); if(!b) return;
  const total = +b.dataset.min * 60000, end = Date.now() + total;
  $("#durs").style.display = "none";
  $("#breakMsg").textContent = "Sip slowly. Your cup empties as the time passes.";
  clearInterval(tick);
  const step = () => {
    const left = Math.max(0, end - Date.now());
    const s = Math.ceil(left/1000);
    $("#clock").textContent = String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
    liq().style.transform = `translateY(${(1-left/total)*120}px)`;
    if(left<=0){
      clearInterval(tick);
      $("#breakMsg").textContent = "Your cup is empty. Pick one article and read it slowly.";
    }
  };
  step(); tick = setInterval(step, 500);
};

/* ---------- load data ---------- */
fetch("articles.json").then(r => r.json()).then(d => {
  state.all = (d.articles || []).slice().sort((a,b)=> (b.date||"").localeCompare(a.date||""));
  [...new Set(state.all.map(a=>a.source))].forEach((s,i)=> state.colors[s] = COLORS[i % COLORS.length]);
  const n = state.all.length, m = new Set(state.all.map(a=>a.source)).size;
  $("#sub").textContent = d.demo ? "Your coffee is ready. Real headlines arrive after the first update."
    : `Your coffee is ready. ${n} reads from ${m} sources are waiting.`;
  if(d.demo) $("#note").innerHTML = `<p class="note">Demo mode: these cards only link to the source sites. Run the Update articles workflow on GitHub and real headlines will replace them.</p>`;
  render();
}).catch(() => {
  $("#feed").innerHTML = `<div class="empty"><strong>Articles didn't load</strong>If you opened this file by double-clicking it, run <code>python3 -m http.server</code> in this folder and open localhost:8000.</div>`;
});
</script>
</body>
</html>
